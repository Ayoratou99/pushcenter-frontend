services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aninfpush-frontend:latest
    container_name: aninfpush_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    environment:
      # Read at container start and written into config.js, so the same image
      # works against any backend without rebuilding.
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      - VITE_API_TIMEOUT=${VITE_API_TIMEOUT:-30000}
      - VITE_API_DOCS_URL=${VITE_API_DOCS_URL:-}
      - VITE_APP_NAME=${VITE_APP_NAME:-AninfPush Management}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
      - VITE_FACEBOOK_APP_ID=${VITE_FACEBOOK_APP_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# To place the frontend on the same network as the backend stack, start it with:
#   docker compose -f docker-compose.yml -f docker-compose.shared.yml up -d
# (the backend compose file creates the `aninfpush_network` network)
